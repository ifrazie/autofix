[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autofix"
version = "0.1.0"
description = "Rule-driven vulnerability remediation engine: one AI-assisted fix applied consistently across a Python codebase."
requires-python = ">=3.10"
dependencies = [
    "libcst>=1.1",
    "PyYAML>=6.0",
    "typer>=0.12",
    "strands-agents>=0.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
autofix = "autofix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
