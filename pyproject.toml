[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autofix"
version = "0.1.0"
description = "Rule-driven vulnerability remediation engine: one AI-assisted fix applied consistently across a Python codebase."
requires-python = ">=3.11"
dependencies = [
    "libcst>=1.1,<2",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
    "strands-agents>=0.1,<2",
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "pytest-cov>=4.0,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
autofix = "autofix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# sample-repo/ holds deliberately-vulnerable fixture code (the demo target); it must
# stay exactly as authored, so it is never linted or auto-fixed.
extend-exclude = ["sample-repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: Typer's public API uses callables (typer.Option/Argument) as parameter
# defaults by design, so flagging function calls in defaults is a false positive here.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed long literal source strings that read best on one line.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/autofix"]
warn_unused_ignores = true
warn_redundant_casts = true

# Third-party packages that ship no type information.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "strands.*", "ollama"]
ignore_missing_imports = true

# numpy (pulled in transitively) ships stubs that use 3.12-only `type` syntax,
# which mypy rejects under our 3.11 target. We don't use numpy directly, so skip it.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
