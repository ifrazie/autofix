id: md5-to-sha256
rationale: "MD5 is cryptographically broken and unsafe for security hashing; use SHA-256 instead."
match:
  call: "md5"
transform:
  prompt: >
    You are given a single Python expression that calls md5(). Rewrite ONLY this
    expression to use hashlib.sha256() in place of md5, and change NOTHING else:
    keep the exact same arguments, and keep any chained method call such as
    .hexdigest() or .digest() exactly as-is. Return valid Python for the single
    expression only (no imports, no statements, no code fences).

    Decide confidence by the PURPOSE of the hash:
    - Password hashing, session tokens, request/API signatures, and integrity or
      tamper detection ARE security uses. For these, the fix IS correct: set
      confident = true.
    - A cache key, ETag, dedup key, or generic non-security fingerprint is NOT a
      security use. For these, changing md5 is unnecessary; set confident = false
      and briefly say it is a non-security checksum left alone.
