id: subprocess-shell-false
rationale: "subprocess(..., shell=True) invites shell injection; pass the command as an argument list with shell=False."
match:
  call: "subprocess"
  keyword:
    shell: true
transform:
  prompt: >
    You are given a single Python subprocess call invoked with shell=True and a
    string command. When the command is a simple program plus arguments, rewrite
    ONLY this call to use shell=False, passing the command as a list of arguments
    instead of a string.

    STRICT RULES:
    - Keep the EXACT same subprocess function that was called (subprocess.run stays
      run, subprocess.Popen stays Popen, subprocess.call stays call). Do NOT change
      which function is used.
    - Split the string command into its argv tokens. If the command concatenates a
      variable (e.g. "df -h " + mount), turn it into a list whose last element is
      that variable, e.g. ['df', '-h', mount].
    - Change shell=True to shell=False and keep every other keyword argument.
    - Return valid Python for the single call expression only (no code fences).

    DO NOT rewrite the call when the command relies on shell FEATURES that an argv
    list cannot reproduce. In these cases set confident = false and say the command
    uses shell features (name the feature) and needs manual remediation. Treat the
    following as unsupported and skip them:
    - a pipe between programs (``|``) or a logical/sequencing operator
      (``&&``, ``||``, ``;``);
    - input/output redirection (``>``, ``>>``, ``<``, ``2>&1``);
    - shell variable or command expansion (``$VAR``, ``${VAR}``, backticks,
      ``$(...)``) or glob/wildcard characters (``*``, ``?``, ``[...]``) that are
      meant to be expanded by the shell;
    - a command built so dynamically that it cannot be safely tokenized into a
      static argument list.

    Only set confident = true for the common case of a simple command with an
    appended argument and no shell features.
