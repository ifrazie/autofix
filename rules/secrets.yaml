id: random-to-secrets
rationale: "The 'random' module is not cryptographically secure; use the 'secrets' module for tokens, keys, and other security-sensitive values."
match:
  call: "random"            # matches random.random/randint/choice/... (root name)
transform:
  prompt: >
    You are given a single Python expression that calls into the 'random' module
    (e.g. random.randint, random.choice, random.random) to produce a value used
    for security: a token, password, key, salt, nonce, OTP, or similar secret.
    Rewrite ONLY this expression to use the cryptographically secure 'secrets'
    module instead, preserving intent:
    - random.randint(a, b)   -> secrets.randbelow(b - a + 1) + a
    - random.choice(seq)     -> secrets.choice(seq)
    - random.random()        -> a secrets-based equivalent for the same range
    Return valid Python for the single expression only (no imports, no statements,
    no code fences); the 'import secrets' line is added separately.

    Decide confidence by PURPOSE. Set confident = true only when the value is
    clearly security-sensitive (a token, key, password, salt, nonce, or OTP). If
    the randomness is for a game, sampling, shuffling test data, jitter, or any
    non-security use, set confident = false and say it is a non-security use left
    alone.
  ensure_import: "import secrets"
